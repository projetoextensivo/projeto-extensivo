server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/odontoagenda;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=12h
spring.jackson.time-zone=America/Sao_Paulo
clinic.admin.email=${ADMIN_EMAIL:}
clinic.admin.password=${ADMIN_PASSWORD:}
clinic.demo=${DEMO_MODE:false}
clinic.allowed-origins=${ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
server.error.include-message=never
logging.level.root=INFO
